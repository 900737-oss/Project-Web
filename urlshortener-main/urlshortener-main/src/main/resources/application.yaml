spring:
  application:
    name: urlshortener
  datasource:
    url: jdbc:hsqldb:mem:urlshortener
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      externalization:
        enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

urlshortener:
  analytics:
    processed-click-retention: 7d
    processed-click-prune-cron: "0 0 3 * * *"

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  health:
    rabbit:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

---
# Externalize preview requests through RabbitMQ.
# Activate: --spring.profiles.active=docker,broker
# Requires: docker compose --profile broker up
spring:
  config:
    activate:
      on-profile: broker
  modulith:
    events:
      externalization:
        enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbit}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: true

management:
  health:
    rabbit:
      enabled: true
