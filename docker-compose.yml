name: urlshortener

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1: &app
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: urlshortener
      DB_PASSWORD: urlshortener
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      URLSHORTENER_ADMIN_TOKEN: ${URLSHORTENER_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app2:
    <<: *app
    # Serialize initial database schema initialization by the Modulith instances.
    # required: false keeps `docker compose up` working when the broker profile is off.
    depends_on:
      app1:
        condition: service_healthy
      rabbit:
        condition: service_healthy
        required: false

  lb:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Started only by `docker compose --profile broker up`.
  # The default user "guest" accepts connections from localhost only, so replicas use another user.
  rabbit:
    profiles: ["broker"]
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: urlshortener
      RABBITMQ_DEFAULT_PASS: urlshortener
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Load runner — same Compose project / network; NOT started by default `up`
  k6:
    profiles: ["load"]
    image: grafana/k6:0.54.0
    depends_on:
      - lb
    volumes:
      - ./scripts:/scripts:ro
    environment:
      BASE_URL: http://lb
    command: ["run", "/scripts/load.k6.js"]

volumes:
  pgdata:
