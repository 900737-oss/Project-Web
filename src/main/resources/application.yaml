spring:
  application:
    name: urlshortener
  datasource:
    url: jdbc:hsqldb:mem:urlshortener
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      externalization:
        enabled: false

urlshortener:
  admin:
    token: ${URLSHORTENER_ADMIN_TOKEN:}
  links:
    redirect-cache-ttl: 1h
  analytics:
    processed-click-retention: 7d
    processed-click-prune-cron: "0 0 3 * * *"

management:
  health:
    rabbit:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,modulith

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

---
# Level 4: durable externalization of ShortUrlUpdatedEvent.
# Activate: docker compose --profile broker up
spring:
  config:
    activate:
      on-profile: broker
  modulith:
    events:
      externalization:
        enabled: true
        serialize-externalization: true
  rabbitmq:
    username: guest
    password: guest
management:
  health:
    rabbit:
      enabled: true
